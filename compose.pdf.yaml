# Standalone opt-in phase-one extractor packaging, NOT an ordinary-stack override.
# No API/DB/intake; a future reviewed integration mounts only the exact channel.
services:
  pdf-extractor:
    image: impostr-pdf:phase1
    platform: linux/amd64
    build:
      context: .
      dockerfile: pdf-extractor/Dockerfile
    user: "10002:10002"
    group_add: ["10001"]
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp=./pdf-extractor/seccomp.json
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    pids_limit: 16
    shm_size: 1m
    tmpfs:
      - /scratch:rw,noexec,nosuid,nodev,size=128m,mode=0700,uid=10002,gid=10002
    volumes:
      - pdf-channel:/run/impostr-pdf
    restart: "no"
    stop_grace_period: 2s
    logging:
      driver: none
volumes:
  pdf-channel:
