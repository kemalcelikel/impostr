server_tokens off;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self'; object-src 'none'; script-src 'self'; style-src 'self'" always;

    location = /api/health {
        limit_except GET {
            deny all;
        }

        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_backend api:8000;
        proxy_pass http://$api_backend/api/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host api;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }

    location = /api {
        return 404;
    }

    # Only the authenticated project conversation route gets streaming behavior.
    # Cookies/query cursor pass unchanged; API authorizes before and during replay.
    location ~ "^/api/projects/[0-9a-fA-F-]{36}/chat/[0-9a-fA-F-]{36}/stream$" {
        limit_except GET { deny all; }
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_backend api:8000;
        proxy_pass http://$api_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host api;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_connect_timeout 2s;
        proxy_read_timeout 45s;
    }

    location /api/ {
        client_max_body_size 1m;

        limit_except GET POST PUT PATCH DELETE {
            deny all;
        }

        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_backend api:8000;
        proxy_pass http://$api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host api;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 15s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
